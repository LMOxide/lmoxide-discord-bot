# On a version tag (v1.2.3): the Linux binary on the GitHub Release
# (lmoxide-discord-bot-1.2.3-x86_64-linux.tar.gz, built on Debian 12: glibc 2.36 or newer) and the
# image ghcr.io/lmoxide/lmoxide-discord-bot (tags 1.2.3, latest, sha-<commit>).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/lmoxide/lmoxide-discord-bot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # the binary alone (the Dockerfile's dist stage), then the image from the same build
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: dist
          outputs: type=local,dest=out
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Archive
        run: |
          name="lmoxide-discord-bot-${GITHUB_REF_NAME#v}-x86_64-linux"
          mkdir "$name"
          cp out/lmoxide-discord-bot config.example.toml README.md "$name/"
          cp -r docs "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: lmoxide-discord-bot-*.tar.gz
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: lmoxide-discord-bot-*.tar.gz
          generate_release_notes: true
